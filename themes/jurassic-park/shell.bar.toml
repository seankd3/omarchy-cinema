# The bar is glass over the void (Glassy bar keeps at most 0.35 of this
# background); its lower edge is a wire of fsn's, drawn by the backdrop.
background       = "#080d22"
background-alpha = 1.0
text             = "#dbe2f0"
# Omarchy shares this token between recording, updates, and other alerts.
active           = "#ec5a50"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
